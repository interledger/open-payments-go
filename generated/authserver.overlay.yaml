overlay: 1.0.0
info:
  title: Extract access_token to named AccessTokenRequest schema
  version: 0.3.0
x-speakeasy-jsonpath: rfc9535

extends: ../open-payments-specifications/openapi/auth-server.yaml

actions:
  # Extract inline access_token objects to named AccessTokenRequest schema
  - target: $.components.schemas
    update:
      AccessTokenRequest:
        type: object
        description: The requested access permissions for the grant.
        required: [access]
        properties:
          access:
            $ref: "#/components/schemas/access"

  - target: $.components.schemas['grant-request-with-access-token'].properties.access_token
    remove: true
  - target: $.components.schemas['grant-request-with-access-token'].properties
    update:
      access_token:
        $ref: "#/components/schemas/AccessTokenRequest"

  - target: $.components.schemas['grant-request-with-subject'].properties.access_token
    remove: true
  - target: $.components.schemas['grant-request-with-subject'].properties
    update:
      access_token:
        $ref: "#/components/schemas/AccessTokenRequest"
